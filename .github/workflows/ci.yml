name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      # The same Postgres image as local development (PostGIS + pgvector +
      # h3, plus the civicpulse_app role), built from infra/db. GitHub
      # service containers can't build images, so compose runs it instead.
      - name: Start Postgres, Redis and MinIO
        working-directory: .
        run: docker compose -f infra/docker-compose.yml up -d --build --wait db redis minio

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: OpenAPI schema is up to date
        run: uv run python scripts/export_openapi.py --check

      - name: Pytest (real Postgres as the app role, real MinIO)
        run: uv run pytest

      - name: Service logs
        if: failure()
        working-directory: .
        run: docker compose -f infra/docker-compose.yml logs db redis minio

  ai-models:
    name: AI models (real weights)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    env:
      AI_MODEL_DIR: ${{ github.workspace }}/apps/api/.models
      AI_REQUIRE_MODELS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies with the ai extra
        run: uv sync --frozen --extra ai

      # The API job type-checks without the extra, where the model
      # libraries' imports are marked as optional; here they are installed,
      # so the code that calls onnxruntime, tokenizers and OpenCV is checked
      # against their real types.
      - name: Pyright (with the ai extra)
        run: uv run pyright

      # ~600 MB of weights; the key changes whenever a pin or hash does.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: apps/api/.models
          key: ai-models-${{ hashFiles('apps/api/models.lock.json') }}

      - name: Download and verify the pinned models
        run: uv run python scripts/download_models.py --model-dir .models

      # tests/ai is pure computation, so it runs without the database the
      # rest of the suite needs (--confcutdir skips tests/conftest.py).
      - name: Model tests
        run: uv run pytest tests/ai --confcutdir=tests/ai -v

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm exec biome check .

      # Next generates route types (LayoutProps, PageProps) that tsc needs.
      - name: Generate Next route types
        run: pnpm --filter @civicpulse/web exec next typegen

      - name: Typecheck
        run: pnpm --filter @civicpulse/web typecheck

      - name: Typecheck the e2e suite
        run: pnpm --filter @civicpulse/e2e typecheck

      - name: Build
        run: pnpm --filter @civicpulse/web build

  e2e:
    name: End-to-end (Playwright, full stack, real models)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The images are built here, with BuildKit's layer cache kept in the
      # GitHub Actions cache (docs/adr/0005-ci-real-model-image-cache.md).
      # The AI worker's dependency and weight layers (~1.3 GB) only change
      # with uv.lock or models.lock.json, so most runs restore them instead
      # of reinstalling and redownloading; a code change rebuilds only the
      # last few layers. Each image has its own cache scope so they don't
      # evict each other. This is also the only place CI builds the images.
      - uses: docker/setup-buildx-action@v3

      - name: Build the database image
        uses: docker/build-push-action@v6
        with:
          context: infra/db
          tags: civicpulse-db:16-3.5
          load: true
          cache-from: type=gha,scope=db
          cache-to: type=gha,scope=db,mode=max

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          tags: civicpulse-api:dev
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the AI worker image (real models, weights verified)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: infra/ai-worker/Dockerfile
          tags: civicpulse-ai-worker:dev
          load: true
          cache-from: type=gha,scope=ai-worker
          cache-to: type=gha,scope=ai-worker,mode=max

      # The whole compose stack, as developers run it, from the images just
      # built: the real AI worker included, so the AI tests (AC-02 to
      # AC-08) run against CLIP itself. The geocoder is off so the run
      # doesn't depend on (or load) the public Nominatim server; wards come
      # from PostGIS either way and the tests accept a missing street
      # address.
      - name: Start the stack
        env:
          GEOCODER: none
        run: docker compose -f infra/docker-compose.yml up -d --no-build --wait

      - name: Seed demo data
        run: docker compose -f infra/docker-compose.yml exec -T ai-worker python scripts/seed.py

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm --filter @civicpulse/e2e exec playwright install --with-deps chromium

      # Built here rather than by Playwright's webServer, so a build
      # failure shows up as its own step; the suite then only runs
      # `next start`.
      - name: Build the web app
        run: pnpm --filter @civicpulse/web build

      - name: Run Playwright
        run: pnpm --filter @civicpulse/e2e test

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Service logs
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs api worker ai-worker beat
