# Local development stack for CivicPulse.
#
#   docker compose -f infra/docker-compose.yml up -d --build --wait
#   docker compose -f infra/docker-compose.yml exec -T ai-worker python scripts/seed.py
#
# This runs the real AI worker (CLIP and YuNet on CPU; the first build
# downloads about 600 MB of weights). To run the same stack with the
# deterministic fake models instead, add the override file:
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.fake-ai.yml up -d --build --wait
#
# Every credential below is a development default for this stack only.
# Override any of them from your shell or with `--env-file .env`.
name: civicpulse

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-civicpulse}
  POSTGRES_USER: ${POSTGRES_USER:-civicpulse}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicpulse}
  APP_DB_USER: ${APP_DB_USER:-civicpulse_app}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:-civicpulse_app}

# Shared by migrate, api and worker. The API and worker connect as the
# non-superuser app role; only `migrate` gets the owner credentials.
x-api-env: &api-env
  ENV: ${ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-civicpulse_app}:${APP_DB_PASSWORD:-civicpulse_app}@db:5432/${POSTGRES_DB:-civicpulse}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3100}
  JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
  OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:-dev-only-otp-hmac-secret-change-me-0123456789}
  TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-mMLHnH8kUFV7fWcw29AMh4zjPaVTPAsXyuGlw5mP07w=}
  DEV_FIXED_OTP: ${DEV_FIXED_OTP:-true}
  REQUIRE_STAFF_MFA: ${REQUIRE_STAFF_MFA:-false}
  # OTP request limits, looser than production's 5 per phone and 30 per IP
  # an hour. Behind Docker's port forwarding every browser on the machine
  # reaches the API from the same gateway address, so the per-IP limit
  # becomes one shared budget, and the seeded accounts are shared by the
  # whole team and the e2e suite. The 30-second resend cooldown stays.
  OTP_MAX_PER_HOUR: ${OTP_MAX_PER_HOUR:-60}
  OTP_MAX_PER_IP_PER_HOUR: ${OTP_MAX_PER_IP_PER_HOUR:-1000}
  # The other per-address limits, loosened for the same shared address.
  OTP_VERIFY_MAX_PER_IP_PER_HOUR: ${OTP_VERIFY_MAX_PER_IP_PER_HOUR:-5000}
  MFA_VERIFY_MAX_PER_IP_PER_HOUR: ${MFA_VERIFY_MAX_PER_IP_PER_HOUR:-1000}
  REFRESH_MAX_PER_IP_PER_HOUR: ${REFRESH_MAX_PER_IP_PER_HOUR:-20000}
  TENANT_LOOKUP_MAX_PER_IP_PER_MINUTE: ${TENANT_LOOKUP_MAX_PER_IP_PER_MINUTE:-3000}
  PUBLIC_MAX_PER_IP_PER_MINUTE: ${PUBLIC_MAX_PER_IP_PER_MINUTE:-3000}
  # Report submissions per citizen, looser than production's 10 an hour
  # and 30 a day for the same reason: the seeded citizen is shared by the
  # team and by e2e runs repeated back to back.
  REPORT_MAX_PER_HOUR: ${REPORT_MAX_PER_HOUR:-500}
  REPORT_MAX_PER_DAY: ${REPORT_MAX_PER_DAY:-5000}
  # Server-side calls go to minio over the compose network; URLs handed to
  # browsers are signed for the host port instead (see app/core/storage.py).
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_BUCKET: ${S3_BUCKET:-civicpulse-media}
  S3_ACCESS_KEY: ${S3_APP_ACCESS_KEY:-civicpulse-app}
  S3_SECRET_KEY: ${S3_APP_SECRET_KEY:-civicpulse-app-secret}
  # Public Nominatim, kept to 1 request/second; set GEOCODER=none offline.
  GEOCODER: ${GEOCODER:-nominatim}
  # Faces in citizen photos are blurred before any public copy exists: the
  # worker holds each photo at "processing" and the AI worker's face check
  # publishes it. Both must agree, hence one setting for every service.
  # Only the ai-worker loads models (AI_PROVIDER there); nothing else does.
  AI_FACE_BLUR: ${AI_FACE_BLUR:-true}
  # Email goes to Mailpit, which keeps every message for inspection at
  # http://localhost:8025 and sends nothing outside the machine. Leaving
  # SMTP_HOST empty switches the outbox's email channel off entirely.
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  # Both empty switches Web Push off (scripts/vapid_keys.py makes a pair).
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_FROM: ${SMTP_FROM:-CivicPulse <no-reply@civicpulse.local>}
  WEB_URL: ${WEB_URL:-http://localhost:3000}
  # Malware scanning, error reporting and tracing: all off unless set.
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  RELEASE: ${RELEASE:-}
  MEDIA_ORIGINAL_RETENTION_DAYS: ${MEDIA_ORIGINAL_RETENTION_DAYS:-0}

services:
  db:
    build:
      context: ./db
    image: civicpulse-db:16-3.5
    environment:
      <<: *db-env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO stopped publishing community images in 2025; pgsty/minio is a
  # maintained build of the same server with pinned release tags.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-civicpulse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-civicpulse-minio}
      # Browsers PUT uploads straight to pre-signed URLs, so the web origins
      # need CORS. MinIO applies this server-wide (it has no per-bucket CORS)
      # and answers preflights for any requested header from these origins.
      MINIO_API_CORS_ALLOW_ORIGIN: ${S3_CORS_ORIGINS:-http://localhost:3000,http://localhost:3100}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot job: creates the private media bucket and a least-privilege
  # user for the API and worker (object read/write/delete on that bucket
  # only), then exits. The root credentials stay here. It has no healthcheck
  # because it doesn't stay up; dependants wait on
  # `service_completed_successfully` instead.
  minio-init:
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-civicpulse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-civicpulse-minio}
      S3_BUCKET: ${S3_BUCKET:-civicpulse-media}
      S3_APP_ACCESS_KEY: ${S3_APP_ACCESS_KEY:-civicpulse-app}
      S3_APP_SECRET_KEY: ${S3_APP_SECRET_KEY:-civicpulse-app-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
        cat > /tmp/app-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {"Effect": "Allow", "Action": ["s3:GetBucketLocation", "s3:ListBucket"],
             "Resource": ["arn:aws:s3:::$$S3_BUCKET"]},
            {"Effect": "Allow", "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
             "Resource": ["arn:aws:s3:::$$S3_BUCKET/*"]}
          ]
        }
        EOF
        mc admin user add local "$$S3_APP_ACCESS_KEY" "$$S3_APP_SECRET_KEY"
        mc admin policy create local civicpulse-app /tmp/app-policy.json
        mc admin policy attach local civicpulse-app --user "$$S3_APP_ACCESS_KEY" 2>/dev/null \
          || echo "policy already attached"
        echo "bucket $$S3_BUCKET ready (private), app user $$S3_APP_ACCESS_KEY configured"
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "8025:8025"
      # SMTP, so the channel can also be exercised from the host.
      - "1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot job: applies migrations as the owner role, then exits.
  migrate:
    # Same image as api (built there); never pulled from a registry.
    image: civicpulse-api:dev
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-env
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-civicpulse}:${POSTGRES_PASSWORD:-civicpulse}@db:5432/${POSTGRES_DB:-civicpulse}
      APP_DB_USER: ${APP_DB_USER:-civicpulse_app}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../apps/api
    image: civicpulse-api:dev
    environment:
      <<: *api-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Media processing, housekeeping, priority recomputes and the matching
  # watchdog. Never the `ai` queue: that belongs to the ai-worker, so every
  # embedding in the database comes from one model.
  worker:
    image: civicpulse-api:dev
    pull_policy: never
    command:
      - celery
      - -A
      - app.worker:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
      - --queues=default
    environment:
      <<: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s

  # Celery worker for the `ai` queue, and its only consumer: embeddings,
  # classification, matching and face blurring on CPU. The image bakes in
  # the weights pinned by apps/api/models.lock.json (see
  # infra/ai-worker/Dockerfile for why they aren't in a volume) and records
  # them in model_registry when it starts. Expect ~1.5 GB of RAM while it
  # works. The seed runs here too, so seeded photos are embedded with the
  # same model as everything else.
  ai-worker:
    build:
      context: ../apps/api
      dockerfile: ../../infra/ai-worker/Dockerfile
    image: civicpulse-ai-worker:dev
    environment:
      <<: *api-env
      AI_PROVIDER: onnx
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker:celery_app inspect ping -d ai@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  # Celery Beat: schedules the hourly housekeeping job onto the worker.
  # Exactly one beat may run per environment, or jobs are scheduled twice.
  # The schedule state file lives in /tmp because the image runs as a
  # non-root user without write access to /app.
  beat:
    image: civicpulse-api:dev
    pull_policy: never
    command:
      - celery
      - -A
      - app.worker:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    environment:
      <<: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Upload malware scanning (P6-07). Opt-in, because the image and its
  # signature database are large: `docker compose --profile scan up -d
  # clamav`, then set CLAMAV_HOST=clamav for the api. With CLAMAV_HOST set
  # and clamd down, upload completion answers 503 instead of skipping the
  # scan. clamd's StreamMaxLength must cover MEDIA_MAX_BYTES (10 MB by
  # default); a larger stream is reported as a scanner error, not a pass.
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scan"]
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  db-data:
  redis-data:
  minio-data:
