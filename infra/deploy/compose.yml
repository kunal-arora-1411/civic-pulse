# CivicPulse demo on one small EC2 instance (no real AI models).
# The server keeps a clone of the repo in ~/civic-pulse and its secrets
# in ~/deploy/.env (never committed). Photos go to S3; Caddy terminates HTTPS for the
# sslip.io hostname that the Vercel rewrite points at.
#
#   docker compose -f infra/deploy/compose.yml --env-file ~/deploy/.env up -d --build --wait
#   docker compose -f infra/deploy/compose.yml --env-file ~/deploy/.env exec -T worker python scripts/seed.py
#
# .github/workflows/deploy.yml runs scripts/deploy.sh here after CI passes on main.
name: civicpulse

x-api-env: &api-env
  ENV: ${ENV}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CORS_ORIGINS: ${CORS_ORIGINS}
  JWT_SECRET: ${JWT_SECRET}
  OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}
  TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
  DEV_FIXED_OTP: ${DEV_FIXED_OTP}
  REQUIRE_STAFF_MFA: ${REQUIRE_STAFF_MFA}
  OTP_MAX_PER_HOUR: ${OTP_MAX_PER_HOUR}
  OTP_MAX_PER_IP_PER_HOUR: ${OTP_MAX_PER_IP_PER_HOUR}
  COOKIE_SECURE: "true"
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  GEOCODER: ${GEOCODER}
  # Deterministic fake models: no weights, no ai-worker image.
  AI_PROVIDER: fake

services:
  db:
    build: ../db
    image: civicpulse-db:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ../../apps/api
    image: civicpulse-api:demo
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-env
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    image: civicpulse-api:demo
    pull_policy: never
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # One worker for both queues: with only the fake models there is no
  # second model whose embeddings could mix with these.
  worker:
    image: civicpulse-api:demo
    pull_policy: never
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO",
              "--concurrency=1", "--queues=default,ai"]
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  beat:
    image: civicpulse-api:demo
    pull_policy: never
    command: ["celery", "-A", "app.worker:celery_app", "beat", "--loglevel=INFO",
              "--schedule=/tmp/celerybeat-schedule"]
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api]
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
  caddy-data:
