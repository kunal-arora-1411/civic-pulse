[project]
name = "civicpulse-api"
version = "0.1.0"
description = "CivicPulse API: civic-issue reporting for municipalities"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.44.9",
    "celery>=5.7.0",
    "cryptography>=50.0.2",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "geoalchemy2>=0.21.0",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.44",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pyotp>=2.12.1",
    "redis>=8.2.0",
    "sqlalchemy[asyncio]>=2.1.9,<2.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "DTZ", "C4"]
ignore = [
    "S101",   # assert is fine in tests and for type narrowing
    "RUF012", # SQLAlchemy/Pydantic class attributes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
# Migrations build DDL from constants and a validated role name.
"alembic/versions/**" = ["E501", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The local alembic/ directory would otherwise make the package look first-party.
known-third-party = ["alembic"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["app", "tests", "alembic", "scripts"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra"
