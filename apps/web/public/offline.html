<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f5d57" />
    <title>Offline · CivicPulse</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, "Noto Sans Devanagari", sans-serif;
        background: #fafbfb;
        color: #142224;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #101a1c; color: #e8efef; }
        p { color: #b8c7c8; }
      }
      main { max-width: 28rem; padding: 1.5rem; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.375rem; margin: 1rem 0 0.5rem; }
      p { line-height: 1.5; color: #3d5254; margin: 0.25rem 0; }
      section + section { margin-top: 1.5rem; }
      button {
        margin-top: 1.5rem;
        font: inherit;
        font-weight: 600;
        padding: 0.75rem 1.25rem;
        min-height: 44px;
        border: 0;
        border-radius: 0.75rem;
        background: #0f5d57;
        color: #fff;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #f2b632; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <section lang="en">
        <h1>You're offline</h1>
        <p>This page isn't saved on your device yet.</p>
        <p>Reports you've already started are kept and sent when you're back online.</p>
      </section>
      <section lang="hi">
        <h1>आप ऑफ़लाइन हैं</h1>
        <p>यह पेज अभी आपके डिवाइस पर सहेजा नहीं गया है।</p>
        <p>आपकी शुरू की गई शिकायतें सुरक्षित हैं और इंटरनेट मिलते ही भेज दी जाएँगी।</p>
      </section>
      <button type="button" id="retry">Try again · फिर कोशिश करें</button>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
